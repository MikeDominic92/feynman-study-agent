name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-first-gates:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      FSA_DB_PATH: ./data/ci.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Precommit checks
        run: npm run precommit:check
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=moderate
